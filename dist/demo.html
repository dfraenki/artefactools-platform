<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>artefactools — Demo en vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<script src="/app.js"></script>
<link rel="stylesheet" href="/style.css">
<div class="container">
  <div class="hero">
    <div class="kicker">Demo en vivo · artefactools</div>
    <h1>Orquestador de sesión</h1>
    <p>Envía un mensaje al Worker desplegado en Cloudflare Workers.</p>
  </div>
  <div class="demo">
    <div class="chat" id="chat"><div class="msgs" id="msgs"></div></div>
    <div class="chat-input"><input id="msg" placeholder="Escribe un mensaje…"><button class="btn btn-primary" id="send">Enviar</button></div>
    <div class="status" id="status">Conectando…</div>
  </div>
</div>
</body>
</html>
